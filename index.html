    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener("load", () => resolve(reader.result));
        reader.addEventListener("error", reject);
        reader.readAsDataURL(file);
      });
    }

    function compressImage(file, maxSize, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          const cv = document.createElement("canvas");
          cv.width = width;
          cv.height = height;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          callback(cv.toDataURL("image/jpeg", quality));
        };
        img.onerror = function() { callback(null); };
        img.src = e.target.result;
      };
      reader.onerror = function() { callback(null); };
      reader.readAsDataURL(file);
    }

    function compressImageAsync(file, maxSize, quality) {
      return new Promise((resolve) => {
        compressImage(file, maxSize, quality, resolve);
      });
    }

    function compressDataUrl(dataUrl, maxSize, quality) {
      return new Promise((resolve) => {
        if (!dataUrl || !dataUrl.startsWith("data:image")) {
          resolve(dataUrl);
          return;
        }
        const img = new Image();
        img.onload = function() {
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          const cv = document.createElement("canvas");
          cv.width = width;
          cv.height = height;
          const ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(cv.toDataURL("image/jpeg", quality));
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    async function prepareNotebookForShare(notebook) {

      const entries = shareNotebook.entries || [];

        const entry = entries[i];
        if (entry.images && entry.images.length) {
          // 分享用更小尺寸和更低质量，确保云端上传成功
          const compressed = await Promise.all(
            entry.images.map((img) => compressDataUrl(img, 280, 0.4))
          );
          entry.images = compressed;
        }
      }
      return shareNotebook;
    }

    async function addComment(entryId, text) {
      const notebook = getCurrentNotebook();
      if (!notebook) return;
      const entry = (notebook.entries || []).find(e => e.id === entryId);
      if (!entry) return;
      if (!Array.isArray(entry.comments)) entry.comments = [];
      entry.comments.push({
        id: createId(),
        nickname: "访客",
        text: text,
        createdAt: new Date().toISOString()
      });
      notebook.updatedAt = new Date().toISOString();
      saveAppData();
      renderDetail();

      // 只读模式下，同步评论到云端
      if (isReadOnlyMode) {
        // 优先使用 kvdb.io 评论同步
        if (notebook.commentBucketId) {
          try {
            const commentsData = collectComments(notebook);
            const uploaded = await uploadCommentsToBucket(notebook.commentBucketId, notebook.id, commentsData);
            showToast(uploaded ? "评论已发布" : "评论已发布到本地");
            return;
          } catch (e) {
            console.error("评论同步失败:", e);
          }
          showToast("评论已发布到本地");
          return;
        }

        // 回退：旧版链接无 cb 参数时，上传整个笔记本到新 paste
        try {
          const slim = JSON.parse(JSON.stringify(notebook));
          delete slim.shareToken;
          delete slim.updatedAt;
          delete slim.createdAt;
          delete slim.commentBucketId;
          if (slim.importantDates && slim.importantDates.length === 0) delete slim.importantDates;
          if (slim.importantDates) {
            slim.importantDates = slim.importantDates.map(d => ({ d: d.date, desc: d.description }));
          }
          if (slim.entries) {
            slim.entries = slim.entries.map(e => {
              const o = { id: e.id, t: e.text || "" };
              if (e.images && e.images.length) o.i = e.images;
              if (e.date) o.d = e.date;
              if (e.comments && e.comments.length) {
                o.cs = e.comments.map(c => ({ n: c.nickname || "访客", x: c.text || "", t: c.createdAt }));
              }
              return o;
            });
          }
          slim.n = slim.name;
          slim.c = slim.coverColor;
          delete slim.name;
          delete slim.coverColor;

          let dataStr = JSON.stringify(slim);
          if (dataStr.length > 400000) {
            const lite = JSON.parse(JSON.stringify(slim));
            lite.entries = (lite.entries || []).map(e => {
              const o = { id: e.id, t: e.t || "", d: e.d };
              if (e.cs && e.cs.length) o.cs = e.cs;
              return o;
            });
            dataStr = JSON.stringify(lite);
          }

          const pasteResult = await uploadToPaste(dataStr);
          if (pasteResult) {
            const baseUrl = new URL(window.location.href);
            baseUrl.search = "";
            baseUrl.hash = "";
            baseUrl.searchParams.set("p", pasteResult.service + ":" + pasteResult.id);
            const newUrl = baseUrl.toString();
            window.history.replaceState({}, "", newUrl);
            showShareLinkToast(newUrl);
            return;
          }
        } catch (e) {
          console.error("评论上传失败:", e);
        }
        showToast("评论已发布到本地");
      }
    }

    async function shortenUrl(longUrl) {
      const encoded = encodeURIComponent(longUrl);
      const services = [
        "https://is.gd/create.php?format=simple&url=" + encoded,
        "https://tinyurl.com/api-create.php?url=" + encoded,
        "https://api.shrtco.de/v2/shorten?url=" + encoded
      ];

      for (let i = 0; i < services.length; i++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);
          const resp = await fetch(services[i], { signal: controller.signal });
          clearTimeout(timeoutId);
          if (resp.ok) {
            const text = (await resp.text()).trim();
            // shrtco.de 返回 JSON
            if (text.startsWith("{")) {
              try {
                const data = JSON.parse(text);
                if (data.ok && data.result?.short_link) {
                  return "https://" + data.result.short_link;
                }
              } catch {}
            } else if (text.startsWith("http")) {
              return text;
            }
          }
        } catch {}
      }
      return null;
    }

    // CORS 代理列表（按优先级排序）
    const CORS_PROXIES = [
      { post: "https://api.allorigins.win/post?url=", raw: "https://api.allorigins.win/raw?url=" },
      { post: "https://corsproxy.io/?", raw: "https://corsproxy.io?" },
      { post: "https://api.codetabs.com/v1/proxy?quest=", raw: "https://api.codetabs.com/v1/proxy?quest=" }
    ];

    // 通过 CORS 代理 POST 请求
    async function corsPost(url, body, timeoutMs) {
      for (let i = 0; i < CORS_PROXIES.length; i++) {
        const proxy = CORS_PROXIES[i];
        const targetUrl = proxy.post + encodeURIComponent(url);
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
          const resp = await fetch(targetUrl, { method: "POST", body: body, signal: controller.signal });
          clearTimeout(timeoutId);
          if (resp.ok) return await resp.text();
        } catch {}
      }
      return null;
    }

    // 通过 CORS 代理 GET 请求
    async function corsGet(url, timeoutMs) {
      // 先尝试直连（部分服务支持 CORS）
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs / 2);
        const resp = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (resp.ok) return await resp.text();
      } catch {}

      // 再尝试各 CORS 代理
      for (let i = 0; i < CORS_PROXIES.length; i++) {
        const proxy = CORS_PROXIES[i];
        const targetUrl = proxy.raw + encodeURIComponent(url);
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
          const resp = await fetch(targetUrl, { signal: controller.signal });
          clearTimeout(timeoutId);
          if (resp.ok) return await resp.text();
        } catch {}
      }
      return null;
    }

    // 将数据上传到云端 paste 服务，返回 { service, id }
    async function uploadToPaste(jsonStr) {
      // 方案1: dpaste.com（原生支持 CORS，最可靠）
      try {
        const form = new FormData();
        form.append("content", jsonStr);
        form.append("syntax", "text");
        form.append("expiry_days", "365");
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const resp = await fetch("https://dpaste.com/api/v2/", {
          method: "POST",
          body: form,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
          const text = await resp.text();
          const match = text.match(/dpaste\.com\/([A-Za-z0-9]+)/);
          if (match) return { service: "dpaste", id: match[1] };
        }
      } catch {}

      // 方案2: paste.rs（直连，速度快，部分浏览器可能 CORS 受限）
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const resp = await fetch("https://paste.rs/", {
          method: "POST",
          body: jsonStr,
          headers: { "Content-Type": "text/plain" },
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
          const text = await resp.text();
          const idMatch = text.trim().match(/\/([A-Za-z0-9]+)\/?$/);
          if (idMatch) return { service: "paster", id: idMatch[1] };
        }
      } catch {}

      // 方案3: 通过 CORS 代理上传到 dpaste.org（备选）
      try {
        const form = new FormData();
        form.append("content", jsonStr);
        form.append("syntax", "text");
        form.append("expiry_days", "365");
        const result = await corsPost("https://dpaste.org/api/", form, 10000);
        if (result) {
          const match = result.match(/dpaste\.org\/([A-Za-z0-9]+)/);
          if (match) return { service: "dpasteorg", id: match[1] };
        }
      } catch {}

      return null;
    }

    // 从云端 paste 服务拉取数据
    async function fetchFromPaste(service, id) {
      let rawUrl = "";
      if (service === "dpaste") {
        rawUrl = "https://dpaste.com/" + id + ".txt";
      } else if (service === "paster") {
        rawUrl = "https://paste.rs/" + id;
      } else if (service === "dpasteorg") {
        rawUrl = "https://dpaste.org/raw/" + id;
      } else if (service === "0x0") {
        rawUrl = "https://0x0.st/" + id;
      } else if (service === "envs") {
        rawUrl = "https://envs.sh/" + id;
      }
      if (!rawUrl) return null;
      return await corsGet(rawUrl, 10000);
    }

    // ====== kvdb.io 评论同步服务 ======
    // 创建评论存储 bucket，返回 bucketId
    async function createCommentBucket() {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const resp = await fetch("https://kvdb.io", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "email=shared-notebook@app.local",
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) {
          const bucketId = (await resp.text()).trim();
          if (bucketId && bucketId.length > 5) return bucketId;
        }
      } catch {}
      // 尝试通过 CORS 代理
      try {
        const result = await corsPost("https://kvdb.io", "email=shared-notebook@app.local", 10000);
        if (result) {
          const bucketId = result.trim();
          if (bucketId && bucketId.length > 5) return bucketId;
        }
      } catch {}
      return null;
    }

    // 上传评论数据到 kvdb.io（PUT 更新）
    async function uploadCommentsToBucket(bucketId, notebookId, commentsData) {
      const key = notebookId.replace(/[^a-zA-Z0-9_:-]/g, "_");
      const url = `https://kvdb.io/${bucketId}/${key}`;
      const body = JSON.stringify(commentsData);
      // 直接 PUT（kvdb.io 支持 CORS）
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const resp = await fetch(url, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: body,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) return true;
      } catch {}
      // 尝试通过 CORS 代理
      try {
        const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        const resp = await fetch(proxyUrl, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: body,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (resp.ok) return true;
      } catch {}
      return false;
    }

    // 从 kvdb.io 获取评论数据
    async function fetchCommentsFromBucket(bucketId, notebookId) {
      const key = notebookId.replace(/[^a-zA-Z0-9_:-]/g, "_");
      const url = `https://kvdb.io/${bucketId}/${key}`;
      // 先直连
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);
        const resp = await fetch(url, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (resp.ok) {
          const text = await resp.text();
          if (text && text.trim()) return JSON.parse(text);
        }
      } catch {}
      // 通过 CORS 代理
      try {
        const text = await corsGet(url, 10000);
        if (text && text.trim()) return JSON.parse(text);
      } catch {}
      return null;
    }

    // 收集笔记本中所有评论，按 entryId 分组
    function collectComments(notebook) {
      const data = {};
      (notebook.entries || []).forEach((entry) => {
        if (entry.comments && entry.comments.length > 0) {
          data[entry.id] = entry.comments.map(c => ({
            n: c.nickname || "访客",
            x: c.text || "",
            t: c.createdAt || new Date().toISOString()
          }));
        }
      });
      return data;
    }

    // 将云端评论合并到笔记本的 entries 中
    function mergeCloudComments(notebook, cloudComments) {
      if (!cloudComments || typeof cloudComments !== "object") return;
      (notebook.entries || []).forEach((entry) => {
        const cloudEntryComments = cloudComments[entry.id];
        if (cloudEntryComments && Array.isArray(cloudEntryComments)) {
          const localComments = entry.comments || [];
          const allComments = [...localComments];
          for (const cc of cloudEntryComments) {
            const exists = localComments.some(lc =>
              lc.text === (cc.x || cc.text || "") &&
              lc.nickname === (cc.n || cc.nickname || "访客") &&
              lc.createdAt === (cc.t || cc.createdAt || "")
            );
            if (!exists) {
              allComments.push({
                id: createId(),
                nickname: cc.n || cc.nickname || "访客",
                text: cc.x || cc.text || "",
                createdAt: cc.t || cc.createdAt || new Date().toISOString()
              });
            }
          }
          entry.comments = allComments;
        }
      });
    }

    // 同步单个笔记本的云端评论（用于用户端打开时自动拉取）
    async function syncCommentsForNotebook(notebook) {
      if (!notebook.commentBucketId) return false;
      const cloudComments = await fetchCommentsFromBucket(notebook.commentBucketId, notebook.id);
      if (cloudComments) {
        const before = JSON.stringify(notebook.entries);
        mergeCloudComments(notebook, cloudComments);
        const after = JSON.stringify(notebook.entries);
        return before !== after;
      }
      return false;
    }

    // 为所有有 commentBucketId 的笔记本同步评论
    async function syncAllCommentBuckets() {
      if (!appData.user?.nickname) return;
      let changed = false;
      for (const notebook of appData.notebooks) {
        if (notebook.commentBucketId) {
          const updated = await syncCommentsForNotebook(notebook);
          if (updated) changed = true;
        }
      }
      if (changed) {
        saveAppData();
        if (currentNotebookId) renderDetail();
      }
    }

    async function shareNotebook() {

      if (!notebook) return;

      const originalLabel = shareButton.textContent;
      shareButton.textContent = "生成中…";
      shareButton.style.pointerEvents = "none";

      try {
        const MAX_FOR_CLOUD = 400000; // 云端上传最大体积（约400KB JSON）

        // 先压缩图片（云端分享始终压缩，确保成功率）
        let shareNotebookData = await prepareNotebookForShare(notebook);
        let imagesStripped = false;

        // 精简字段
        const slim = JSON.parse(JSON.stringify(shareNotebookData));
        delete slim.shareToken;
        delete slim.updatedAt;
        delete slim.createdAt;
        if (slim.importantDates && slim.importantDates.length === 0) delete slim.importantDates;
        if (slim.importantDates) {
          slim.importantDates = slim.importantDates.map(d => ({
            d: d.date,
            desc: d.description
          }));
        }
        if (slim.entries) {
          slim.entries = slim.entries.map((e) => {
            const o = { id: e.id, t: e.text || "" };
            if (e.images && e.images.length) o.i = e.images;
            if (e.date) o.d = e.date;
            // 评论数据：精简字段名
            if (e.comments && e.comments.length) {
              o.cs = e.comments.map(c => ({
                n: c.nickname || "访客",
                x: c.text || "",
                t: c.createdAt
              }));
            }
            return o;
          });
        }
        // 精简本子名称和封面字段
        slim.n = slim.name;
        slim.c = slim.coverColor;
        delete slim.name;
        delete slim.coverColor;

        let dataStr = JSON.stringify(slim);

        // 数据过大时剥离图片（保留文字和评论）
        if (dataStr.length > MAX_FOR_CLOUD) {
          const lite = JSON.parse(JSON.stringify(slim));
          lite.entries = (lite.entries || []).map((e) => {
            const o = { id: e.id, t: e.t || "", d: e.d };
            if (e.cs && e.cs.length) o.cs = e.cs; // 保留评论
            return o;
          });
          dataStr = JSON.stringify(lite);
          imagesStripped = true;
        }

        // 上传到云端 paste 服务
        shareButton.textContent = "上传中…";
        const pasteResult = await uploadToPaste(dataStr);

        // 创建或复用评论同步 bucket
        if (!notebook.commentBucketId) {
          const bucketId = await createCommentBucket();
          if (bucketId) {
            notebook.commentBucketId = bucketId;
            saveAppData();
          }
        }

        const baseUrl = new URL(window.location.href);
        baseUrl.search = "";
        baseUrl.hash = "";

        let shareUrl;
        let isShortLink = false;

        if (pasteResult) {
          // 云端分享：链接只带服务标识和短ID
          baseUrl.searchParams.set("p", pasteResult.service + ":" + pasteResult.id);
          if (notebook.commentBucketId) {
            baseUrl.searchParams.set("cb", notebook.commentBucketId);
          }
          shareUrl = baseUrl.toString();

          // 尝试用短链接服务进一步缩短（后台尝试，不阻塞主流程）
          // 注意：云端分享链接本身已很短（约30-50字符），短链接为可选优化
          (async () => {
            try {
              const shortUrl = await shortenUrl(shareUrl);
              if (shortUrl) {
                shareUrl = shortUrl;
                isShortLink = true;
                // 如果已经复制到剪贴板了，重新复制一次更短的
                try {
                  if (navigator.clipboard) {
                    await navigator.clipboard.writeText(shareUrl);
                  }
                } catch {}
              }
            } catch {}
          })();
        } else {
          // 云端上传失败，回退到 URL 直连方式
          // 进一步压缩到 URL 能承载的大小
          let finalData = dataStr;
          if (toBase64Url(finalData).length > 2000) {
            const ultraLite = { n: slim.n, c: slim.c, entries: (slim.entries || []).slice(0, 5).map(e => {
              const o = { id: e.id, t: e.t?.substring(0, 100) || "", d: e.d };
              if (e.cs && e.cs.length) o.cs = e.cs.slice(0, 3); // 保留前3条评论
              return o;
            }) };
            finalData = JSON.stringify(ultraLite);
            imagesStripped = true;
          }
          const encoded = toBase64Url(finalData);
          baseUrl.searchParams.set("d", encoded);
          if (notebook.commentBucketId) {
            baseUrl.searchParams.set("cb", notebook.commentBucketId);
          }
          shareUrl = baseUrl.toString();
        }

        shareButton.textContent = originalLabel;
        shareButton.style.pointerEvents = "";

        let baseMsg = isReadOnlyMode ? "链接已复制" : "分享链接已复制，可发送给他人打开";
        if (imagesStripped) {
          baseMsg += "\n\n（提示：内容较多，链接中不含图片。减少内容或图片后再分享即可包含完整内容）";
        }
        if (pasteResult) {
          baseMsg += "\n\n（云端分享模式，链接已大幅缩短）";
        }

        try {
          if (navigator.clipboard) {
            await navigator.clipboard.writeText(shareUrl);
            alert(baseMsg);
          } else if (navigator.share) {
            await navigator.share({ title: notebook.name, text: shareUrl });
          } else {
            alert(shareUrl + "\n\n" + baseMsg);
          }
        } catch {
          alert(shareUrl + "\n\n" + baseMsg);
        }
      } catch (e) {
        shareButton.textContent = originalLabel;
        shareButton.style.pointerEvents = "";
        alert("生成分享链接失败，请重试");
      }
    }

    function exportData() {
      if (!appData.user?.nickname) {
        alert("还没有可导出的数据");
        return;
      }

      const payload = {
        exportedAt: new Date().toISOString(),
        app: "与TA",
        version: 1,
        data: appData
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `与TA数据备份_${formatDateInputValue()}.json`;
      document.body.appendChild(link);
      link.click();
      URL.revokeObjectURL(link.href);
      link.remove();
    }

    function renderColorPicker() {
      colorPicker.innerHTML = "";
      NOTEBOOK_COLORS.forEach((color) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `color-dot${color === selectedCoverColor ? " selected" : ""}`;
        button.style.background = color;
        button.setAttribute("aria-label", `选择颜色 ${color}`);
        button.addEventListener("click", () => {
          selectedCoverColor = color;
          renderColorPicker();
          updateNotebookPreview();
        });
        colorPicker.appendChild(button);
      });
    }

    function updateNotebookPreview() {
      const previewName = notebookNameInput.value.trim() || "故事本名称";
      notebookPreview.style.setProperty("--preview-color", selectedCoverColor);
      previewNotebookName.textContent = previewName;
    }

    function openCreateModal() {
      selectedCoverColor = NOTEBOOK_COLORS[(appData.notebooks.length || 0) % NOTEBOOK_COLORS.length];
      notebookNameInput.value = "";
      renderColorPicker();
      updateNotebookPreview();
      createModalOverlay.classList.add("open");
      createModalOverlay.setAttribute("aria-hidden", "false");

      createModalOverlay.classList.remove("open");
      createModalOverlay.setAttribute("aria-hidden", "true");

    function createNotebook() {
      const name = notebookNameInput.value.trim();
      if (!name) {
        showHint(modalHint, "请输入手账本名称");
        notebookNameInput.focus();
        return;
      }

      const now = new Date().toISOString();
      appData.notebooks.unshift({
        id: createId(),
        name,
        coverColor: selectedCoverColor,
        createdAt: now,
        updatedAt: now,
        entries: [],
        importantDates: [],
        shareToken: createShareToken()
      });

      saveAppData();
      closeCreateModal();
      renderHome();
    }

      sidebarOverlay.setAttribute("aria-hidden", "false");
    }

    }

    function parseSharedNotebook(encoded) {
      let jsonStr = null;
      try {
        jsonStr = fromBase64Url(encoded);
      } catch {
        try {
          jsonStr = decodeURIComponent(escape(atob(encoded)));
        } catch {
          return null;
        }
      }
      if (!jsonStr) return null;
      const parsed = JSON.parse(jsonStr);
      // 兼容精简字段名
      if (parsed.n) { parsed.name = parsed.n; delete parsed.n; }
      if (parsed.c) { parsed.coverColor = parsed.c; delete parsed.c; }
      if (parsed.importantDates && Array.isArray(parsed.importantDates)) {
        parsed.importantDates = parsed.importantDates.map(d => ({
          id: createId(),
          date: d.date || d.d,
          description: d.description || d.desc,
          createdAt: new Date().toISOString()
        }));
      }
      // 兼容精简字段格式（t/i/d → text/images/date）
      if (parsed.entries && Array.isArray(parsed.entries)) {
        parsed.entries = parsed.entries.map((e) => {
          const entry = {
            id: e.id || createId(),
            text: e.text ?? e.t ?? "",
            images: e.images || e.i || [],
            date: e.date || e.d || new Date().toISOString().split("T")[0]
          };
          // 还原评论数据（精简格式 cs → comments）
          if (e.cs && Array.isArray(e.cs)) {
            entry.comments = e.cs.map(c => ({
              id: createId(),
              nickname: c.nickname || c.n || "匿名",
              text: c.text || c.x || "",
              createdAt: c.createdAt || c.t || new Date().toISOString()
            }));
          } else if (e.comments && Array.isArray(e.comments)) {
            // 兼容未精简的格式
            entry.comments = e.comments;
          }
          return entry;
        });
      }
      return normalizeNotebook(parsed);
    }

    async function initializeApp() {
      appData = loadAppData();
      saveAppData();

      const queryParams = new URLSearchParams(window.location.search);

      // 云端分享模式: ?p=service:id
      const pasteParam = queryParams.get("p");
      if (pasteParam) {
        const parts = pasteParam.split(":");
        if (parts.length >= 2) {
          const cbParam = queryParams.get("cb") || "";
          loadSharedFromPaste(parts[0], parts.slice(1).join(":"), cbParam);
          return;
        }
      }

      // URL 直连模式: ?d=... 或 ?data=...
      const sharedData = queryParams.get("d") || queryParams.get("data");
      const cbParamForDirect = queryParams.get("cb") || "";
      if (sharedData) {
        try {
          const sharedNotebook = parseSharedNotebook(sharedData);
          if (sharedNotebook && sharedNotebook.id) {
            if (cbParamForDirect) {
              sharedNotebook.commentBucketId = cbParamForDirect;
            }
            const existingIdx = appData.notebooks.findIndex((n) => n.id === sharedNotebook.id);
            if (existingIdx === -1) {
              appData.notebooks.push(sharedNotebook);
            } else {
              const localNb = appData.notebooks[existingIdx];
              if (!localNb.commentBucketId && sharedNotebook.commentBucketId) {
                localNb.commentBucketId = sharedNotebook.commentBucketId;
              }
              (sharedNotebook.entries || []).forEach((sharedEntry) => {
                let localEntry = (localNb.entries || []).find(e => e.id === sharedEntry.id);
                if (!localEntry) {
                  localEntry = (localNb.entries || []).find(e =>
                    (e.text || "") === (sharedEntry.text || "") &&
                    JSON.stringify(e.images || []) === JSON.stringify(sharedEntry.images || [])
                  );
                }
                if (localEntry) {
                  const localComments = localEntry.comments || [];
                  const sharedComments = sharedEntry.comments || [];
                  const allComments = [...localComments];
                  for (const sc of sharedComments) {
                    const exists = localComments.some(lc =>
                      lc.text === sc.text && lc.nickname === sc.nickname &&
                      lc.createdAt === sc.createdAt
                    );
                    if (!exists) allComments.push(sc);
                  }
                  localEntry.comments = allComments;
                } else {
                  localNb.entries = localNb.entries || [];
                  localNb.entries.push(sharedEntry);
                }
              });
            }
            saveAppData();
            isReadOnlyMode = true;
            currentNotebookId = sharedNotebook.id;
            selectedEntryImages = [];
            updateUserUI();
            renderDetail();
            showPage("detail");
            // 异步拉取云端评论并更新
            if (sharedNotebook.commentBucketId) {
              (async () => {
                const cloudComments = await fetchCommentsFromBucket(sharedNotebook.commentBucketId, sharedNotebook.id);
                if (cloudComments) {
                  const nb = getCurrentNotebook();
                  if (nb) {
                    mergeCloudComments(nb, cloudComments);
                    saveAppData();
                    renderDetail();
                  }
                }
              })();
            }
            return;
          }
        } catch (e) {
          console.error("解析分享数据失败:", e);
        }
        showPage("shareError");
        return;
      }

      if (routeToken) {
        const sharedNotebook = appData.notebooks.find((item) => item.shareToken === routeToken);
        if (sharedNotebook) {
          isReadOnlyMode = true;
          currentNotebookId = sharedNotebook.id;
          selectedEntryImages = [];
          updateUserUI();
          renderDetail();
          showPage("detail");
          return;
        }
        isReadOnlyMode = false;
      }

      if (appData.user?.nickname) {
        renderHome();
        // 异步同步所有已分享笔记本的云端评论
        syncAllCommentBuckets();
      } else {
        startSplash();
      }
    }

    async function loadSharedFromPaste(service, id, commentBucketId) {
      // 先显示加载状态
      showPage("shareLoading");

      // 最多重试 2 次
      let jsonStr = null;
      for (let attempt = 0; attempt < 2 && !jsonStr; attempt++) {
        jsonStr = await fetchFromPaste(service, id);
        if (!jsonStr && attempt === 0) {
          await new Promise(r => setTimeout(r, 800));
        }
      }

      if (!jsonStr) {
        showPage("shareError");
        return;
      }

      try {
        const parsed = JSON.parse(jsonStr);
        const nb = parseSharedNotebookFromObject(parsed);
        if (nb && nb.id) {
          // 从 URL 参数设置 commentBucketId（优先于数据中自带的）
          if (commentBucketId) {
            nb.commentBucketId = commentBucketId;
          }

          // 从 kvdb.io 拉取云端评论并合并到分享数据中
          const bucketId = nb.commentBucketId;
          if (bucketId) {
            const cloudComments = await fetchCommentsFromBucket(bucketId, nb.id);
            if (cloudComments) {
              mergeCloudComments(nb, cloudComments);
            }
          }

          const existingIdx = appData.notebooks.findIndex((n) => n.id === nb.id);
          if (existingIdx === -1) {
            // 本地没有该笔记本，直接添加
            appData.notebooks.push(nb);
          } else {
            // 本地已有该笔记本，合并 entries 和评论
            const localNb = appData.notebooks[existingIdx];
            // 同步 commentBucketId
            if (!localNb.commentBucketId && nb.commentBucketId) {
              localNb.commentBucketId = nb.commentBucketId;
            }
            (nb.entries || []).forEach((sharedEntry) => {
              // 先按 ID 匹配
              let localEntry = (localNb.entries || []).find(e => e.id === sharedEntry.id);
              // 回退：按内容匹配（防止 ID 丢失导致重复）
              if (!localEntry) {
                localEntry = (localNb.entries || []).find(e =>
                  (e.text || "") === (sharedEntry.text || "") &&
                  JSON.stringify(e.images || []) === JSON.stringify(sharedEntry.images || [])
                );
              }
              if (localEntry) {
                // 合并评论：本地评论 + 云端评论（去重）
                const localComments = localEntry.comments || [];
                const sharedComments = sharedEntry.comments || [];
                const allComments = [...localComments];
                for (const sc of sharedComments) {
                  const exists = localComments.some(lc =>
                    lc.text === sc.text && lc.nickname === sc.nickname &&
                    lc.createdAt === sc.createdAt
                  );
                  if (!exists) allComments.push(sc);
                }
                localEntry.comments = allComments;
              } else {
                localNb.entries = localNb.entries || [];
                localNb.entries.push(sharedEntry);
              }
            });
          }
          saveAppData();
          isReadOnlyMode = true;
          currentNotebookId = nb.id;
          selectedEntryImages = [];
          updateUserUI();
          renderDetail();
          showPage("detail");
          return;
        }
      } catch (e) {
        console.error("解析云端分享数据失败:", e);
      }
      showPage("shareError");
    }

    function parseSharedNotebookFromObject(parsed) {
      // 兼容精简字段名
      if (parsed.n) { parsed.name = parsed.n; delete parsed.n; }
      if (parsed.c) { parsed.coverColor = parsed.c; delete parsed.c; }
      if (parsed.importantDates && Array.isArray(parsed.importantDates)) {
        parsed.importantDates = parsed.importantDates.map(d => ({
          id: createId(),
          date: d.date || d.d,
          description: d.description || d.desc,
          createdAt: new Date().toISOString()
        }));
      }
      if (parsed.entries && Array.isArray(parsed.entries)) {
        parsed.entries = parsed.entries.map((e) => {
          const entry = {
            id: e.id || createId(),
            text: e.text ?? e.t ?? "",
            images: e.images || e.i || [],
            date: e.date || e.d || new Date().toISOString().split("T")[0]
          };
          // 还原评论数据（精简格式 cs → comments）
          if (e.cs && Array.isArray(e.cs)) {
            entry.comments = e.cs.map(c => ({
              id: createId(),
              nickname: c.nickname || c.n || "匿名",
              text: c.text || c.x || "",
              createdAt: c.createdAt || c.t || new Date().toISOString()
            }));
          } else if (e.comments && Array.isArray(e.comments)) {
            // 兼容未精简的格式
            entry.comments = e.comments;
          }
          return entry;
        });
      }
      return normalizeNotebook(parsed);
    }

    initializeApp();
  </script>
